<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f5f1; stroke: #d9d6cc; stroke-width: 1.5; }
    .hot { stroke: #e30613; stroke-width: 2; }
    .glow { fill: none; stroke: #e30613; stroke-width: 4; opacity: 0; }
    .name { fill: #1d2433; font-size: 15px; font-weight: 700; }
    .sub { fill: #6b7280; font-size: 11.5px; }
    .edge { stroke: #9aa1ad; stroke-width: 1.6; fill: none; }
    .loop { stroke: #e30613; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .loopText { fill: #e30613; font-size: 11.5px; }
    .chip { fill: #e9e6dd; }
    .chipText { fill: #1d2433; font-size: 10px; font-weight: 600; }
    .cell { fill: #e9e6dd; }
    .dot { fill: #e30613; }
    .title { fill: #1d2433; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #1b1e26; stroke: #343947; }
      .name, .chipText, .title { fill: #e8e9ee; }
      .sub { fill: #9aa1ad; }
      .chip, .cell { fill: #2a2e39; }
    }
  </style>
  <rect class="bg" width="900" height="300" rx="14"/>
  <text class="title" x="20" y="32">SAME QUESTION · SIX LANGUAGES · ONE VERDICT PER SEED</text>

  <!-- edges -->
  <path class="edge" d="M140 120 H770"/>
  <path class="loop" d="M530 158 C530 245 80 245 80 158"/>
  <text class="loopText" x="210" y="262">no violation → new attack strategy (up to 4)</text>

  <!-- moving probe -->
  <circle class="dot" r="6">
    <animateMotion dur="6s" repeatCount="indefinite" path="M140 120 H770" keyPoints="0;0;1;1" keyTimes="0;0.06;0.96;1" calcMode="linear"/>
  </circle>
  <circle class="dot" r="4" opacity="0.7">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M530 158 C530 245 80 245 80 158" keyPoints="0;0;1;1" keyTimes="0;0.62;0.9;1" calcMode="linear"/>
  </circle>

  <!-- nodes: x centres 80 230 380 530 680 830 -->
  <g>
    <rect class="box" x="20" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="20" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.06;0.14;1" values="1;1;0;0"/>
    </rect>
    <text class="name" x="80" y="114" text-anchor="middle">Attacker</text>
    <text class="sub" x="80" y="132" text-anchor="middle">70B · strategy</text>
  </g>
  <g>
    <rect class="box" x="170" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="170" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.10;0.14;0.24;1" values="0;0;1;0;0"/>
    </rect>
    <text class="name" x="230" y="114" text-anchor="middle">Mutator</text>
    <text class="sub" x="230" y="132" text-anchor="middle">translates</text>
  </g>
  <g>
    <rect class="box hot" x="320" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="320" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.34;0.38;0.48;1" values="0;0;1;0;0"/>
    </rect>
    <text class="name" x="380" y="114" text-anchor="middle">Target</text>
    <text class="sub" x="380" y="132" text-anchor="middle">Apertus 8B</text>
  </g>
  <g>
    <rect class="box" x="470" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="470" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.58;0.62;0.72;1" values="0;0;1;0;0"/>
    </rect>
    <text class="name" x="530" y="114" text-anchor="middle">Judge</text>
    <text class="sub" x="530" y="132" text-anchor="middle">70B · claims</text>
  </g>
  <g>
    <rect class="box" x="620" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="620" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.82;0.86;0.94;1" values="0;0;1;0;0"/>
    </rect>
    <text class="name" x="680" y="114" text-anchor="middle">Verifier</text>
    <text class="sub" x="680" y="132" text-anchor="middle">langs × seeds</text>
  </g>
  <g>
    <rect class="box" x="770" y="82" width="120" height="76" rx="12"/>
    <rect class="glow" x="770" y="82" width="120" height="76" rx="12">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.95;0.99;1" values="0;0;1;0"/>
    </rect>
    <text class="name" x="830" y="114" text-anchor="middle">Scribe</text>
    <text class="sub" x="830" y="132" text-anchor="middle">findings JSON</text>
  </g>

  <!-- language chips under the mutator -->
  <g>
    <rect class="chip" x="152" y="168" width="24" height="16" rx="8"/><text class="chipText" x="164" y="180" text-anchor="middle">en</text>
    <rect class="chip" x="179" y="168" width="24" height="16" rx="8"/><text class="chipText" x="191" y="180" text-anchor="middle">de</text>
    <rect class="chip" x="206" y="168" width="28" height="16" rx="8"/><text class="chipText" x="220" y="180" text-anchor="middle">gsw</text>
    <rect class="chip" x="237" y="168" width="22" height="16" rx="8"/><text class="chipText" x="248" y="180" text-anchor="middle">fr</text>
    <rect class="chip" x="262" y="168" width="20" height="16" rx="8"/><text class="chipText" x="272" y="180" text-anchor="middle">it</text>
    <rect class="chip" x="285" y="168" width="24" height="16" rx="8"/><text class="chipText" x="297" y="180" text-anchor="middle">rm</text>
  </g>

  <!-- verifier grid: 6 languages × 3 seeds, cells turn red as violations reproduce -->
  <g transform="translate(641 168)">
    <rect class="cell" x="0" y="0" width="11" height="11" rx="2"/><rect class="cell" x="13" y="0" width="11" height="11" rx="2"/><rect class="cell" x="26" y="0" width="11" height="11" rx="2"/><rect class="cell" x="39" y="0" width="11" height="11" rx="2"/><rect class="cell" x="52" y="0" width="11" height="11" rx="2"/><rect class="cell" x="65" y="0" width="11" height="11" rx="2"/>
    <rect class="cell" x="0" y="13" width="11" height="11" rx="2"/><rect class="cell" x="13" y="13" width="11" height="11" rx="2"/><rect class="cell" x="26" y="13" width="11" height="11" rx="2"/><rect class="cell" x="39" y="13" width="11" height="11" rx="2"/><rect class="cell" x="52" y="13" width="11" height="11" rx="2"/><rect class="cell" x="65" y="13" width="11" height="11" rx="2"/>
    <rect class="cell" x="0" y="26" width="11" height="11" rx="2"/><rect class="cell" x="13" y="26" width="11" height="11" rx="2"/><rect class="cell" x="26" y="26" width="11" height="11" rx="2"/><rect class="cell" x="39" y="26" width="11" height="11" rx="2"/><rect class="cell" x="52" y="26" width="11" height="11" rx="2"/><rect class="cell" x="65" y="26" width="11" height="11" rx="2"/>
    <!-- reproduced cells (illustrative pattern: minority languages fail more) -->
    <g fill="#e30613" opacity="0">
      <rect x="26" y="0" width="11" height="11" rx="2"/><rect x="26" y="13" width="11" height="11" rx="2"/><rect x="26" y="26" width="11" height="11" rx="2"/>
      <rect x="39" y="0" width="11" height="11" rx="2"/><rect x="39" y="26" width="11" height="11" rx="2"/>
      <rect x="65" y="0" width="11" height="11" rx="2"/><rect x="65" y="13" width="11" height="11" rx="2"/><rect x="65" y="26" width="11" height="11" rx="2"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.84;0.9;0.98;1" values="0;0;1;1;0"/>
    </g>
  </g>

</svg>
