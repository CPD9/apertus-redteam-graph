<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f5f1; stroke: #d9d6cc; stroke-width: 1.5; }
    .box.hot { stroke: #e30613; stroke-width: 2; }
    .inner { fill: #ffffff; stroke: #d9d6cc; stroke-width: 1; }
    .title { fill: #1d2433; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    .eyebrow { fill: #5d6470; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .head { fill: #1d2433; font-size: 18px; font-weight: 700; }
    .name { fill: #1d2433; font-size: 14px; font-weight: 700; }
    .label { fill: #1d2433; font-size: 12.5px; font-weight: 700; }
    .txt { fill: #1d2433; font-size: 12px; }
    .sub { fill: #5d6470; font-size: 11.5px; }
    .quote { font-size: 11px; }
    .chip { fill: #e9e6dd; }
    .chipText { fill: #1d2433; font-size: 11px; font-weight: 600; }
    .line { fill: #d9d6cc; }
    .ink { fill: #1d2433; }
    .ico { fill: none; stroke: #5d6470; stroke-width: 1.6; }
    .edge { fill: none; stroke: #6b7280; stroke-width: 1.6; }
    .off { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .red { fill: #e30613; }
    .onRed { fill: #ffffff; }
    .pale { fill: #fbe4e5; stroke: #ecc4c7; }
    .warn { fill: #fdecec; stroke: #e30613; stroke-width: 1.5; }
    .redLine { fill: none; stroke: #e30613; stroke-width: 1.5; }
    .btn { fill: #1d2433; }
    .btnText { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .s0 { stop-color: #fbe4e5; }
    .s1 { stop-color: #e30613; }
    .big { font-size: 17px; font-weight: 700; }
    .lang { font-size: 13px; font-weight: 700; }

    /* travelling highlight: 10 s loop, one part after another */
    .spot { opacity: 0; animation: spot 10s infinite; }
    .d2 { animation-delay: 2s; }
    .d4 { animation-delay: 4s; }
    .d6 { animation-delay: 6s; }
    .d8 { animation-delay: 8s; }
    .ring { fill: none; stroke: #e30613; stroke-width: 2.5; }
    .timer { animation: run 10s linear infinite; }
    .flow { stroke-dasharray: 4 5; animation: flow 1.2s linear infinite; }
    .pulse { fill: none; stroke: #e30613; stroke-width: 2; opacity: .5; animation: pulse 2s ease-in-out infinite; }
    .step { animation: step 3s infinite; }
    .t1 { animation-delay: 1s; opacity: 0; }
    .t2 { animation-delay: 2s; opacity: 0; }
    @keyframes spot { 0% { opacity: 0; } 2%, 18% { opacity: 1; } 20%, 100% { opacity: 0; } }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(240px); } }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%, 100% { opacity: .15; } 50% { opacity: .85; } }
    @keyframes step { 0%, 30% { opacity: 1; } 34%, 100% { opacity: 0; } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #1b1e26; stroke: #343947; }
      .inner { fill: #0d1117; stroke: #343947; }
      .title, .head, .name, .label, .txt, .chipText { fill: #e8e9ee; }
      .eyebrow, .sub { fill: #9aa1ad; }
      .chip { fill: #2a2e39; }
      .line { fill: #343947; }
      .ink { fill: #e8e9ee; }
      .ico { stroke: #9aa1ad; }
      .edge { stroke: #5c6370; }
      .off { fill: #0d1117; stroke: #6b7280; }
      .pale { fill: #3a2328; stroke: #5a3138; }
      .warn { fill: #2e1a1e; }
      .btn { fill: #e8e9ee; }
      .btnText { fill: #0d1117; }
      .s0 { stop-color: #3a2328; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="scale">
      <stop offset="0" class="s0"/>
      <stop offset="1" class="s1"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="900" height="490" rx="14"/>

  <!-- titles + 10 s timer -->
  <text class="title" x="20" y="32">THE 10-SECOND TEST</text>
  <text class="sub" x="239" y="31.5" text-anchor="end">0 s</text>
  <path class="edge" d="M252 27.5 H492 M252 23 V32 M492 23 V32"/>
  <text class="sub" x="500" y="31.5">10 s</text>
  <circle class="red timer" cx="252" cy="27.5" r="5"/>
  <text class="title" x="560" y="32">NIK'S QUEUE · IN ORDER</text>

  <!-- ============ left: one finding card ============ -->
  <rect class="box" x="60" y="56" width="476" height="414" rx="14"/>
  <text class="eyebrow" x="80" y="80">FINDING</text>

  <!-- 1 plain sentence -->
  <text class="head" x="80" y="113">Apertus confirms a wrong signature count</text>

  <!-- 2 six-language strip (hero) -->
  <g text-anchor="middle">
    <rect class="pale" x="80" y="142" width="66" height="74" rx="10"/>
    <text class="ink lang" x="113" y="166">en</text><text class="ink big" x="113" y="198">0%</text>
    <rect class="red" x="154" y="142" width="66" height="74" rx="10"/>
    <text class="onRed lang" x="187" y="166">de</text><text class="onRed big" x="187" y="198">100%</text>
    <rect class="red" x="228" y="142" width="66" height="74" rx="10"/>
    <text class="onRed lang" x="261" y="166">gsw</text><text class="onRed big" x="261" y="198">100%</text>
    <rect class="red" x="302" y="142" width="66" height="74" rx="10"/>
    <text class="onRed lang" x="335" y="166">fr</text><text class="onRed big" x="335" y="198">100%</text>
    <rect class="red" x="376" y="142" width="66" height="74" rx="10"/>
    <text class="onRed lang" x="409" y="166">it</text><text class="onRed big" x="409" y="198">100%</text>
    <rect class="red" x="450" y="142" width="66" height="74" rx="10"/>
    <text class="onRed lang" x="483" y="166">rm</text><text class="onRed big" x="483" y="198">100%</text>
  </g>
  <text class="sub" x="80" y="235">0%</text>
  <rect x="102" y="227" width="90" height="8" rx="4" fill="url(#scale)"/>
  <text class="sub" x="198" y="235">100%</text>
  <text class="sub" x="236" y="235">of runs failed</text>
  <text class="sub" x="516" y="235" text-anchor="end">same question · six languages</text>

  <!-- 3 quote vs sourced reference -->
  <rect class="inner" x="80" y="260" width="212" height="82" rx="10"/>
  <text class="label" x="94" y="280">What Apertus said</text>
  <rect class="red" x="94" y="292" width="3" height="36" rx="1.5"/>
  <rect class="line" x="105" y="293" width="150" height="7" rx="3.5"/>
  <rect class="line" x="105" y="307" width="172" height="7" rx="3.5"/>
  <rect class="line" x="105" y="321" width="112" height="7" rx="3.5"/>

  <rect class="inner" x="304" y="260" width="212" height="82" rx="10"/>
  <text class="label" x="318" y="280">What is correct</text>
  <rect class="line" x="318" y="293" width="170" height="7" rx="3.5"/>
  <rect class="line" x="318" y="307" width="134" height="7" rx="3.5"/>
  <rect class="chip" x="318" y="318" width="56" height="17" rx="8.5"/>
  <text class="chipText" x="346" y="330.5" text-anchor="middle">source</text>

  <!-- 4 control badge -->
  <rect class="warn" x="80" y="366" width="312" height="30" rx="15"/>
  <circle class="red" cx="97" cy="381" r="8"/>
  <text class="onRed" x="97" y="385" font-size="11" font-weight="700" text-anchor="middle">!</text>
  <text class="label" x="112" y="385.5">Clearly worse with the false premise</text>
  <text class="sub" x="404" y="385.5">premise vs neutral</text>

  <!-- 5 judge details, collapsed -->
  <rect class="inner" x="80" y="420" width="436" height="30" rx="8"/>
  <text class="label" x="94" y="440">Details</text>
  <path class="ico" d="M154 430.5 l5 4.5 l-5 4.5"/>
  <text class="sub" x="504" y="439.5" text-anchor="end">judge details, collapsed</text>

  <!-- callouts 1-5 in reading order -->
  <path class="edge flow" d="M34 107 V435"/>
  <path class="edge" d="M46 107 H76 M46 189 H76 M46 301 H76 M46 381 H76 M46 435 H76"/>
  <g text-anchor="middle">
    <circle class="red" cx="34" cy="107" r="12"/><text class="onRed lang" x="34" y="111.5">1</text>
    <circle class="red" cx="34" cy="189" r="12"/><text class="onRed lang" x="34" y="193.5">2</text>
    <circle class="red" cx="34" cy="301" r="12"/><text class="onRed lang" x="34" y="305.5">3</text>
    <circle class="red" cx="34" cy="381" r="12"/><text class="onRed lang" x="34" y="385.5">4</text>
    <circle class="red" cx="34" cy="435" r="12"/><text class="onRed lang" x="34" y="439.5">5</text>
  </g>

  <!-- highlight ring, one per part, staggered by 2 s -->
  <g class="spot"><rect class="ring" x="70" y="90" width="456" height="34" rx="10"/><circle class="ring" cx="34" cy="107" r="17"/></g>
  <g class="spot d2"><rect class="ring" x="70" y="134" width="456" height="110" rx="12"/><circle class="ring" cx="34" cy="189" r="17"/></g>
  <g class="spot d4"><rect class="ring" x="70" y="252" width="456" height="98" rx="12"/><circle class="ring" cx="34" cy="301" r="17"/></g>
  <g class="spot d6"><rect class="ring" x="70" y="358" width="456" height="46" rx="12"/><circle class="ring" cx="34" cy="381" r="17"/></g>
  <g class="spot d8"><rect class="ring" x="70" y="412" width="456" height="46" rx="12"/><circle class="ring" cx="34" cy="435" r="17"/></g>

  <!-- ============ right: Nik's queue ============ -->
  <path class="edge flow" d="M562 93 V433"/>
  <circle class="pulse" cx="562" cy="93" r="11"/>
  <circle class="red" cx="562" cy="93" r="6"/>
  <circle class="off" cx="562" cy="178" r="5"/>
  <circle class="off" cx="562" cy="263" r="5"/>
  <circle class="off" cx="562" cy="348" r="5"/>
  <circle class="off" cx="562" cy="433" r="5"/>

  <!-- review page -->
  <rect class="box hot" x="580" y="56" width="300" height="74" rx="12"/>
  <rect class="btn" x="594" y="64" width="52" height="26" rx="7"/>
  <text class="btnText" x="620" y="81.5" text-anchor="middle">Yes</text>
  <rect class="inner" x="594" y="96" width="52" height="26" rx="7"/>
  <text class="label" x="620" y="113.5" text-anchor="middle">No</text>
  <text class="name" x="660" y="81">Review page</text>
  <rect class="red" x="830" y="67" width="38" height="18" rx="9"/>
  <text class="onRed" x="849" y="80" font-size="11" font-weight="700" text-anchor="middle">SAT</text>
  <rect class="chip" x="660" y="92" width="84" height="8" rx="4"/>
  <rect class="red" x="660" y="92" width="20" height="8" rx="4"/>
  <text class="label" x="752" y="100">12 / 50 labelled</text>
  <text class="sub quote" x="660" y="119">“you agree with the judge on 10 of 12”</text>

  <!-- honest wording -->
  <rect class="box" x="580" y="141" width="300" height="74" rx="12"/>
  <path class="ico" d="M600 160 h40 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-26 l-8 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-18 a6 6 0 0 1 6 -6 z"/>
  <text class="label" x="620" y="180" text-anchor="middle">Aa</text>
  <text class="name" x="660" y="166">Honest wording</text>
  <rect class="chip" x="830" y="152" width="38" height="18" rx="9"/>
  <text class="chipText" x="849" y="165" text-anchor="middle">SUN</text>
  <g text-anchor="middle">
    <rect class="chip" x="660" y="174" width="54" height="18" rx="9"/><text class="chipText" x="687" y="187">flagged</text>
    <rect class="chip" x="719" y="174" width="50" height="18" rx="9"/><text class="chipText" x="744" y="187">quoted</text>
    <rect class="chip" x="774" y="174" width="76" height="18" rx="9"/><rect class="redLine" x="774" y="174" width="76" height="18" rx="9"/><text class="chipText" x="812" y="187">uncounted</text>
  </g>
  <text class="sub" x="660" y="207">not “reproduced”, not “confirmed”</text>

  <!-- explain mode -->
  <rect class="box" x="580" y="226" width="300" height="74" rx="12"/>
  <path class="edge" d="M607 248 H615 M625 248 H633"/>
  <circle class="off" cx="602" cy="248" r="5"/>
  <circle class="off" cx="620" cy="248" r="5"/>
  <circle class="off" cx="638" cy="248" r="5"/>
  <circle class="red step" cx="602" cy="248" r="5"/>
  <circle class="red step t1" cx="620" cy="248" r="5"/>
  <circle class="red step t2" cx="638" cy="248" r="5"/>
  <rect class="inner" x="594" y="261" width="52" height="22" rx="7"/>
  <text class="label" x="620" y="276" text-anchor="middle">next ›</text>
  <text class="name" x="660" y="251">Explain mode</text>
  <rect class="chip" x="830" y="237" width="38" height="18" rx="9"/>
  <text class="chipText" x="849" y="250" text-anchor="middle">SUN</text>
  <text class="txt" x="660" y="271">step through one hypothesis</text>
  <text class="sub" x="660" y="289">recorded, no GPU</text>

  <!-- accessibility -->
  <rect class="box" x="580" y="311" width="300" height="74" rx="12"/>
  <rect class="ico" x="607" y="320" width="26" height="56" rx="6"/>
  <circle class="ico" cx="620" cy="344" r="8"/>
  <path class="ink" d="M620 336 a8 8 0 0 0 0 16 z"/>
  <path class="ico" d="M615 369 H625"/>
  <text class="name" x="660" y="336">Accessibility</text>
  <rect class="chip" x="830" y="322" width="38" height="18" rx="9"/>
  <text class="chipText" x="849" y="335" text-anchor="middle">SUN</text>
  <g text-anchor="middle">
    <rect class="chip" x="660" y="344" width="44" height="18" rx="9"/><text class="chipText" x="682" y="357">4.5:1</text>
    <rect class="chip" x="709" y="344" width="44" height="18" rx="9"/><text class="chipText" x="731" y="357">focus</text>
    <rect class="chip" x="758" y="344" width="52" height="18" rx="9"/><text class="chipText" x="784" y="357">390 px</text>
  </g>
  <text class="sub" x="660" y="377">and reduced motion</text>

  <!-- screenshots -->
  <rect class="box" x="580" y="396" width="300" height="74" rx="12"/>
  <rect class="ico" x="609" y="413" width="14" height="7" rx="2"/>
  <rect class="ico" x="598" y="419" width="44" height="30" rx="6"/>
  <circle class="ico" cx="620" cy="434" r="8"/>
  <circle class="ink" cx="635" cy="425" r="1.8"/>
  <text class="name" x="660" y="421">Screenshots</text>
  <rect class="chip" x="830" y="407" width="38" height="18" rx="9"/>
  <text class="chipText" x="849" y="420" text-anchor="middle">SUN</text>
  <text class="txt" x="660" y="441">one theme</text>
  <text class="sub" x="660" y="459">before the 23:00 freeze</text>
</svg>
